{{ define "main" }}
<header class="page-hero shell">
  <p class="eyebrow">ARCHIVE</p>
  <h1>{{ .Title }}</h1>
  <p>{{ .Description }}</p>
</header>
<section class="shell section">
  {{ $pages := .RegularPages.ByDate.Reverse }}
  {{ $pager := .Paginate $pages }}
  <div class="card-grid">
    {{ range $pager.Pages }}{{ partial "post-card.html" . }}{{ end }}
  </div>
  {{ template "_internal/pagination.html" . }}
</section>
{{ end }}
