{{- $resource := .Page.Resources.GetMatch .Destination -}}
{{- if $resource -}}
  {{- $small := $resource.Fit "720x720 webp q78" -}}
  {{- $large := $resource.Fit "1400x1400 webp q82" -}}
  <figure class="content-image">
    <a href="{{ $resource.RelPermalink }}">
      <img src="{{ $large.RelPermalink }}"
           srcset="{{ $small.RelPermalink }} {{ $small.Width }}w, {{ $large.RelPermalink }} {{ $large.Width }}w"
           sizes="(max-width: 760px) 100vw, 760px"
           width="{{ $large.Width }}" height="{{ $large.Height }}"
           alt="{{ .Text }}" loading="lazy" decoding="async">
    </a>
    {{ with .Title }}<figcaption>{{ . }}</figcaption>{{ end }}
  </figure>
{{- else -}}
  <img src="{{ .Destination | safeURL }}" alt="{{ .Text }}" loading="lazy">
{{- end -}}
